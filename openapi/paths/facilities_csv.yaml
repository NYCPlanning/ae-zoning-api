              0004a8532521d7d9879f82f67f7fb2e5,SIXTEEN SYCAMORES PLAYGROUND,"358 SCHERMERHORN STREET, BROOKLYN, NY 11217",3000575,3001730023,NYC Department of Parks and Recreation,City,Public,NYC Department of Parks and Recreation,"Parks, Gardens, and Historical Sites",Parks and Plazas,Recreation and Waterfront Sites,B,A,C,2013
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
